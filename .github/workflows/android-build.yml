name: Sword Android CI Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10 for Chaquopy
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve and verify Python 3.10 executable
        shell: bash
        run: |
          PYTHON_BIN="${{ steps.setup-python.outputs.python-path }}"
          if [ -z "$PYTHON_BIN" ] || [ ! -x "$PYTHON_BIN" ]; then
            PYTHON_BIN="$(command -v python3)"
          fi
          echo "Resolved Python executable: $PYTHON_BIN"
          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -c 'import sys; assert sys.version_info[:2] == (3, 10), f"Expected Python 3.10, got {sys.version}"'
          echo "PYTHON310_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35 and Build Tools 35.0.0
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Make Gradle Wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run Debug Unit Tests
        shell: bash
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --max-workers=1 \
            -Psword.buildPython="${PYTHON310_BIN}"

      - name: Upload Unit Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sword-android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=1 \
            -Psword.buildPython="${PYTHON310_BIN}"

      - name: Verify Debug APK and Generate SHA-256 Checksum
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          APK_FILE="${APK_DIR}/app-debug.apk"
          SHA_FILE="${APK_DIR}/app-debug.apk.sha256"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Expected APK not found at $APK_FILE"
            exit 1
          fi

          if [ ! -s "$APK_FILE" ]; then
            echo "ERROR: Generated APK at $APK_FILE is empty (0 bytes)"
            exit 1
          fi

          (
            cd "$APK_DIR"
            sha256sum app-debug.apk > app-debug.apk.sha256
          )

          APK_SIZE=$(wc -c < "$APK_FILE")
          APK_SHA256=$(awk '{print $1}' "$SHA_FILE")

          echo "Verified APK: $APK_FILE (${APK_SIZE} bytes)"
          echo "SHA-256: $APK_SHA256"
          cat "$SHA_FILE"

          {
            echo "### Sword Android Debug Build"
            echo "- **APK Path**: \`$APK_FILE\`"
            echo "- **Size**: ${APK_SIZE} bytes"
            echo "- **SHA-256**: \`$APK_SHA256\`"
            echo "- **Python (Chaquopy)**: \`$PYTHON310_BIN\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK and SHA-256 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sword-android-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
