
name: Sword Android CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Test & Build Debug APK
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve Python executable
        shell: bash
        run: |
          PYTHON_BIN="${{ steps.setup-python.outputs.python-path }}"
          if [ -z "$PYTHON_BIN" ] || [ ! -x "$PYTHON_BIN" ]; then
            PYTHON_BIN="$(command -v python3)"
          fi
          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -c 'import sys; assert sys.version_info[:2] == (3, 10)'
          echo "PYTHON310_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Run Debug Unit Tests
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --max-workers=1 \
            -Psword.buildPython="${PYTHON310_BIN}"

      - name: Upload Unit Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sword-android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=1 \
            -Psword.buildPython="${PYTHON310_BIN}"

      - name: Generate Debug SHA-256
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          test -s app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sword-android-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  build-release:
    name: Build & Publish Signed Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve Python executable
        shell: bash
        run: |
          PYTHON_BIN="${{ steps.setup-python.outputs.python-path }}"
          if [ -z "$PYTHON_BIN" ] || [ ! -x "$PYTHON_BIN" ]; then
            PYTHON_BIN="$(command -v python3)"
          fi
          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -c 'import sys; assert sys.version_info[:2] == (3, 10)'
          echo "PYTHON310_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          KEYSTORE_PATH="$RUNNER_TEMP/sword-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "SWORD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run Debug Unit Tests
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --max-workers=1 \
            -Psword.buildPython="${PYTHON310_BIN}"

      - name: Build Signed Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=1 \
            -Psword.buildPython="${PYTHON310_BIN}"

      - name: Verify Release APK and Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          APK_FILE="$APK_DIR/app-release.apk"

          test -s "$APK_FILE"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK_FILE"

          cd "$APK_DIR"
          sha256sum app-release.apk > app-release.apk.sha256

          echo "Release APK verified."
          cat app-release.apk.sha256

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sword-android-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sword Android ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
